# Netlify 배포 설정
# 정적 사이트(빌드 없음) + 서버리스 함수(서울 공공데이터 프록시)

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 서울 공공데이터 API 키는 코드에 넣지 말고 Netlify 환경변수로 설정하세요:
#   Site settings → Environment variables → SEOUL_API_KEY (필수)
#                                          → SEOUL_SERVICE (선택: 교육 데이터셋 서비스명)

# ===== 보안 헤더 =====
# CSP: Firebase(gstatic/googleapis/firebaseapp), Google 로그인(accounts.google.com),
#      GA(googletagmanager/google-analytics), 폰트/아이콘(fonts.googleapis/gstatic, cdnjs)만 허용
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.googletagmanager.com https://apis.google.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://*.googletagmanager.com https://*.google.com; frame-src https://philosophyaiedumain.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'"

# ===== 검색엔진 비공개 (관리자·로그인·내부 도구) =====
# 인증·권한 규칙은 그대로 두고, 색인만 막습니다. 공개 페이지는 robots.txt 에서 모두 허용합니다.
[[headers]]
  for = "/admin-dashboard*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/reviews-admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/contents-admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/knowledge-admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/firebase-app*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/auth-system*"
  [headers.values]
    X-Robots-Tag = "noindex"

# ===== 후기 페이지 서버 렌더링 + 사이트맵 =====
# /reviews, /reviews/<slug> 는 함수가 완성된 HTML 을 돌려줘 크롤러가 JS 없이 후기 본문을 읽습니다.
# (force=true: 정적 대체 파일 reviews.html 보다 함수가 우선)
[[redirects]]
  from = "/reviews"
  to = "/.netlify/functions/reviews"
  status = 200
  force = true
[[redirects]]
  from = "/reviews/:slug"
  to = "/.netlify/functions/reviews?slug=:slug"
  status = 200
  force = true
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# 배포 폴더(.)에 함께 올라가는 개발용 파일은 공개하지 않습니다.
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
